<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Офлайн — СУНЦ Инфо</title>
  <meta name="theme-color" content="#f59e0b" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Manrope", "Segoe UI", system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background:
        radial-gradient(1200px 500px at 85% -10%, rgba(251, 191, 36, 0.18), transparent 60%),
        radial-gradient(900px 420px at -10% 0%, rgba(245, 158, 11, 0.12), transparent 55%),
        #faf7f2;
      color: #1c1917;
    }
    @media (prefers-color-scheme: dark) {
      body {
        background:
          radial-gradient(1200px 500px at 85% -10%, rgba(245, 158, 11, 0.12), transparent 60%),
          radial-gradient(900px 420px at -10% 0%, rgba(245, 158, 11, 0.08), transparent 55%),
          #1c1917;
        color: #f5f5f4;
      }
      .card { background: #292524; border-color: rgba(255,255,255,0.1); }
      .muted { color: #a8a29e; }
    }
    .card {
      max-width: 420px;
      width: 100%;
      background: #ffffff;
      border: 1px solid rgba(28, 25, 23, 0.08);
      border-radius: 20px;
      padding: 40px 32px;
      text-align: center;
      box-shadow: 0 20px 40px -20px rgba(28, 25, 23, 0.15);
    }
    .badge {
      width: 72px; height: 72px;
      margin: 0 auto 20px;
      border-radius: 22px;
      background: linear-gradient(135deg, #fbbf24, #f97316);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; font-weight: 800; color: #fff;
      box-shadow: 0 10px 25px -8px rgba(249, 115, 22, 0.5);
    }
    h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 10px; }
    p { font-size: 14.5px; line-height: 1.65; }
    .muted { color: #78716c; }
    .hint {
      margin-top: 18px;
      padding: 12px 16px;
      border-radius: 12px;
      background: rgba(245, 158, 11, 0.08);
      border: 1px solid rgba(245, 158, 11, 0.2);
      font-size: 12.5px;
      line-height: 1.6;
      color: #92400e;
    }
    @media (prefers-color-scheme: dark) {
      .hint { color: #fcd34d; background: rgba(245, 158, 11, 0.1); border-color: rgba(245, 158, 11, 0.25); }
    }
    button {
      margin-top: 22px;
      padding: 12px 28px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #f59e0b, #ea580c);
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    button:hover { transform: translateY(-1px); box-shadow: 0 8px 20px -6px rgba(234, 88, 12, 0.5); }
    button:active { transform: translateY(0); }
  </style>
</head>
<body>
  <main class="card">
    <div class="badge">ФМШ</div>
    <h1>Нет подключения</h1>
    <p class="muted">«СУНЦ Инфо» работает только онлайн: меню, расписание и погода загружаются с серверов школы.</p>
    <div class="hint">
      Проверьте Wi-Fi или мобильный интернет и попробуйте снова — расписание звонков доступно даже офлайн, если страница открывалась ранее.
    </div>
    <button onclick="location.reload()">Повторить</button>
  </main>
  <script>
    window.addEventListener("online", () => location.reload());
  </script>
</body>
</html>
