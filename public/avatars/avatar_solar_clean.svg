<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="sunBg" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="45%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </radialGradient>
    <linearGradient id="whiteCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="sunShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#431407" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Солнечный скругленный квадрат -->
  <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#sunBg)"/>
  <rect x="32" y="32" width="960" height="960" rx="224" fill="none" stroke="#fed7aa" stroke-width="6" opacity="0.7"/>

  <!-- Солнечные лучи науки сверху -->
  <g stroke="#ffffff" stroke-width="9" stroke-linecap="round" opacity="0.9">
    <line x1="512" y1="95" x2="512" y2="150"/>
    <line x1="310" y1="165" x2="350" y2="205"/>
    <line x1="714" y1="165" x2="674" y2="205"/>
    <line x1="160" y1="300" x2="215" y2="320"/>
    <line x1="864" y1="300" x2="809" y2="320"/>
  </g>

  <!-- Солнце знаний с символом атома -->
  <g filter="url(#sunShadow)">
    <circle cx="512" cy="275" r="95" fill="#ffffff"/>
    <circle cx="512" cy="275" r="82" fill="#fef3c7"/>
    
    <!-- Атом внутри солнца -->
    <g transform="translate(512, 275)">
      <ellipse cx="0" cy="0" rx="60" ry="22" fill="none" stroke="#ea580c" stroke-width="4.5" transform="rotate(-30)"/>
      <ellipse cx="0" cy="0" rx="60" ry="22" fill="none" stroke="#ea580c" stroke-width="4.5" transform="rotate(30)"/>
      <circle cx="0" cy="0" r="10" fill="#c2410c"/>
    </g>
  </g>

  <!-- Белоснежная контрастная карточка под главный текст ФМШ -->
  <g filter="url(#sunShadow)">
    <rect x="120" y="440" width="784" height="420" rx="54" fill="url(#whiteCard)"/>
    <rect x="136" y="456" width="752" height="388" rx="42" fill="none" stroke="#ea580c" stroke-width="3" opacity="0.25"/>

    <!-- Лаконичный заголовок СУНЦ НГУ -->
    <text x="512" y="535" font-family="DejaVu Sans, Arial, sans-serif" font-size="44" font-weight="900" fill="#ea580c" text-anchor="middle" letter-spacing="12">
      СУНЦ  НГУ
    </text>

    <line x1="260" y1="565" x2="764" y2="565" stroke="#fed7aa" stroke-width="3"/>

    <!-- Огромный, жирный, контрастный ФМШ -->
    <text x="512" y="730" font-family="DejaVu Sans, Arial, sans-serif" font-size="175" font-weight="900" fill="#0f172a" text-anchor="middle" letter-spacing="14">
      ФМШ
    </text>

    <!-- Минималистичная точка-акцент снизу -->
    <circle cx="512" cy="785" r="5" fill="#ea580c"/>
  </g>
</svg>