<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="gold3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Скругленный квадрат -->
  <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#bg3)"/>
  <rect x="32" y="32" width="960" height="960" rx="224" fill="none" stroke="url(#gold3)" stroke-width="5" opacity="0.8"/>

  <!-- Тонкий золотой круг -->
  <circle cx="512" cy="512" r="390" fill="none" stroke="url(#gold3)" stroke-width="3" opacity="0.6"/>

  <!-- Атомные орбиты строго по центру -->
  <g transform="translate(512, 512)">
    <ellipse cx="0" cy="0" rx="360" ry="130" fill="none" stroke="#60a5fa" stroke-width="7" opacity="0.6" transform="rotate(-30)"/>
    <ellipse cx="0" cy="0" rx="360" ry="130" fill="none" stroke="#60a5fa" stroke-width="7" opacity="0.6" transform="rotate(30)"/>
    <ellipse cx="0" cy="0" rx="360" ry="130" fill="none" stroke="#818cf8" stroke-width="5" opacity="0.35" transform="rotate(90)"/>
    
    <!-- Золотые и лазурные электроны -->
    <circle cx="280" cy="160" r="16" fill="url(#gold3)"/>
    <circle cx="-280" cy="-160" r="16" fill="url(#gold3)"/>
    <circle cx="-280" cy="160" r="16" fill="#38bdf8"/>
    <circle cx="280" cy="-160" r="16" fill="#38bdf8"/>
  </g>

  <!-- Мощный монолитный ФМШ строго по центру -->
  <g filter="url(#softGlow)">
    <text x="512" y="605" font-family="DejaVu Sans, Arial, sans-serif" font-size="280" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="18">
      ФМШ
    </text>
  </g>
</svg>