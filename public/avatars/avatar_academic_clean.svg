<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bg1" cx="50%" cy="38%" r="68%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#facc15"/>
      <stop offset="70%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <linearGradient id="txtGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Скругленный квадрат-плитка (Squircle) -->
  <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#bg1)"/>
  <rect x="32" y="32" width="960" height="960" rx="224" fill="none" stroke="url(#gold)" stroke-width="6" opacity="0.85"/>
  <rect x="52" y="52" width="920" height="920" rx="204" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.25"/>

  <!-- Орбитали атома физики и математики на фоне -->
  <g transform="translate(512, 512)" opacity="0.85">
    <!-- Орбита 1 -->
    <ellipse cx="0" cy="0" rx="360" ry="130" fill="none" stroke="#38bdf8" stroke-width="7" opacity="0.7" transform="rotate(-30)"/>
    <!-- Орбита 2 -->
    <ellipse cx="0" cy="0" rx="360" ry="130" fill="none" stroke="#38bdf8" stroke-width="7" opacity="0.7" transform="rotate(30)"/>
    <!-- Орбита 3 -->
    <ellipse cx="0" cy="0" rx="360" ry="130" fill="none" stroke="#818cf8" stroke-width="5" opacity="0.4" transform="rotate(90)"/>

    <!-- Электроны на орбитах (золотые и бирюзовые) -->
    <circle cx="280" cy="160" r="16" fill="url(#gold)" filter="url(#glow)"/>
    <circle cx="-280" cy="-160" r="16" fill="url(#gold)" filter="url(#glow)"/>
    <circle cx="-280" cy="160" r="16" fill="#38bdf8" filter="url(#glow)"/>
    <circle cx="280" cy="-160" r="16" fill="#38bdf8" filter="url(#glow)"/>
  </g>

  <!-- Верхняя деликатная подпись: СУНЦ НГУ -->
  <text x="512" y="320" font-family="DejaVu Sans, Arial, sans-serif" font-size="44" font-weight="800" fill="url(#gold)" text-anchor="middle" letter-spacing="16">
    СУНЦ  НГУ
  </text>

  <!-- Центральный мощный монолитный текст ФМШ -->
  <!-- Огромные, четко читаемые буквы даже на микро-аватарке 32x32 -->
  <g filter="url(#glow)">
    <text x="512" y="600" font-family="DejaVu Sans, Arial, sans-serif" font-size="260" font-weight="900" fill="url(#txtGrad)" text-anchor="middle" letter-spacing="16">
      ФМШ
    </text>
  </g>
</svg>