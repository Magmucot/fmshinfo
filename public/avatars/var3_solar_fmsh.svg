<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="shadow3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#7c2d12" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Теплый оранжево-янтарный фон «Солнце СУНЦ» -->
  <rect x="32" y="32" width="960" height="960" rx="220" fill="url(#sunGrad)"/>
  <rect x="32" y="32" width="960" height="960" rx="220" fill="none" stroke="#fed7aa" stroke-width="5" opacity="0.6"/>

  <!-- Лучи солнца знаний -->
  <g stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.85">
    <line x1="512" y1="130" x2="512" y2="175"/>
    <line x1="310" y1="210" x2="340" y2="245"/>
    <line x1="714" y1="210" x2="684" y2="245"/>
    <line x1="170" y1="350" x2="215" y2="365"/>
    <line x1="854" y1="350" x2="809" y2="365"/>
  </g>

  <!-- Солнце знаний -->
  <circle cx="512" cy="310" r="105" fill="#ffffff" filter="url(#shadow3)"/>
  <circle cx="512" cy="310" r="88" fill="#fef3c7"/>
  
  <!-- Научный символ внутри солнца: Сигма / Атом -->
  <g transform="translate(512, 310)">
    <ellipse cx="0" cy="0" rx="65" ry="24" fill="none" stroke="#ea580c" stroke-width="4" transform="rotate(-30)"/>
    <ellipse cx="0" cy="0" rx="65" ry="24" fill="none" stroke="#ea580c" stroke-width="4" transform="rotate(30)"/>
    <circle cx="0" cy="0" r="9" fill="#c2410c"/>
  </g>

  <!-- Белая контрастная карточка ФМШ -->
  <rect x="140" y="460" width="744" height="360" rx="46" fill="url(#cardBg)" filter="url(#shadow3)"/>
  <rect x="156" y="476" width="712" height="328" rx="34" fill="none" stroke="#fed7aa" stroke-width="3"/>

  <!-- Надпись СУНЦ НГУ -->
  <text x="512" y="555" font-family="DejaVu Sans, Arial, sans-serif" font-size="44" font-weight="900" fill="#ea580c" text-anchor="middle" letter-spacing="10">
    СУНЦ  НГУ
  </text>
  
  <line x1="280" y1="585" x2="744" y2="585" stroke="#fed7aa" stroke-width="2.5"/>

  <!-- Надпись ФМШ -->
  <text x="512" y="715" font-family="DejaVu Sans, Arial, sans-serif" font-size="130" font-weight="900" fill="#0f172a" text-anchor="middle" letter-spacing="14">
    ФМШ
  </text>

  <!-- Подпись снизу -->
  <text x="512" y="775" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="800" fill="#64748b" text-anchor="middle" letter-spacing="6">
    НОВОСИБИРСК  ·  АКАДЕМГОРОДОК
  </text>
</svg>