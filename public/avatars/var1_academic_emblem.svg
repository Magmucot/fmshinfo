<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#facc15"/>
      <stop offset="70%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <linearGradient id="badge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Фон: супер-элегантный скругленный квадрат -->
  <rect x="32" y="32" width="960" height="960" rx="220" fill="url(#bg1)"/>
  <rect x="32" y="32" width="960" height="960" rx="220" fill="none" stroke="url(#gold)" stroke-width="6" opacity="0.8"/>
  <rect x="52" y="52" width="920" height="920" rx="200" fill="none" stroke="#60a5fa" stroke-width="1.5" opacity="0.3"/>

  <!-- Тонкие круги щита -->
  <circle cx="512" cy="512" r="395" fill="none" stroke="url(#gold)" stroke-width="4" opacity="0.7"/>
  <circle cx="512" cy="512" r="375" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8 6" opacity="0.4"/>

  <!-- Заголовок сверху: СУНЦ НГУ -->
  <text x="512" y="195" font-family="DejaVu Sans, Arial, sans-serif" font-size="46" font-weight="900" fill="url(#gold)" text-anchor="middle" letter-spacing="14" filter="url(#drop)">
    СУНЦ  НГУ
  </text>
  
  <line x1="320" y1="225" x2="704" y2="225" stroke="url(#gold)" stroke-width="3" opacity="0.8"/>
  <circle cx="512" cy="225" r="5" fill="url(#gold)"/>

  <!-- Атомные орбиты физики и математики -->
  <g transform="translate(512, 470)">
    <ellipse cx="0" cy="0" rx="280" ry="95" fill="none" stroke="#38bdf8" stroke-width="5" opacity="0.75" transform="rotate(-30)"/>
    <ellipse cx="0" cy="0" rx="280" ry="95" fill="none" stroke="#38bdf8" stroke-width="5" opacity="0.75" transform="rotate(30)"/>
    <ellipse cx="0" cy="0" rx="280" ry="95" fill="none" stroke="#818cf8" stroke-width="4" opacity="0.5" transform="rotate(90)"/>

    <!-- Электроны -->
    <circle cx="210" cy="120" r="13" fill="url(#gold)"/>
    <circle cx="-210" cy="-120" r="13" fill="url(#gold)"/>
    <circle cx="-210" cy="120" r="13" fill="#67e8f9"/>
    <circle cx="210" cy="-120" r="13" fill="#67e8f9"/>

    <!-- Центральный бейдж под ФМШ -->
    <rect x="-240" y="-95" width="480" height="190" rx="42" fill="url(#badge)" stroke="url(#gold)" stroke-width="6" filter="url(#drop)"/>
    <rect x="-225" y="-80" width="450" height="160" rx="30" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.4"/>

    <!-- Главная надпись ФМШ -->
    <text x="0" y="44" font-family="DejaVu Sans, Arial, sans-serif" font-size="140" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="12" filter="url(#drop)">
      ФМШ
    </text>
  </g>

  <!-- Нижний блок: Новосибирск · Академгородок -->
  <line x1="300" y1="710" x2="724" y2="710" stroke="url(#gold)" stroke-width="3" opacity="0.8"/>
  <circle cx="512" cy="710" r="5" fill="url(#gold)"/>

  <text x="512" y="775" font-family="DejaVu Sans, Arial, sans-serif" font-size="34" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="8">
    АКАДЕМГОРОДОК
  </text>
  <text x="512" y="825" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="700" fill="url(#gold)" text-anchor="middle" letter-spacing="6" opacity="0.9">
    ФИЗМАТШКОЛА  ·  ОСН. 1963
  </text>
</svg>